name: Unpack frozen v3 package

on:
  push:
    branches: [main]
    paths:
      - "GC_Skew_Phase_Coherence_Repository_v3(1).zip"
      - ".github/workflows/unpack-frozen-v3.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack exact frozen package
        shell: bash
        run: |
          set -euo pipefail
          archive='GC_Skew_Phase_Coherence_Repository_v3(1).zip'
          test -f "$archive"
          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          src="$tmp/GC_Skew_Phase_Coherence_Repository_v3"
          test -d "$src"
          cp -a "$src"/. .
          rm -f "$archive"
          rm -f .github/workflows/unpack-frozen-v3.yml
          sha256sum -c FROZEN_CODE_SHA256SUMS
          sha256sum -c SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish exact frozen v3 reproducibility package"
          git push
